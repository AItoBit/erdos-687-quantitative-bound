name: Lean complete candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
      - uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/jacobsthalLean435/.lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/AbsorptionCutoff/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: proof-progress-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: proof-progress-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
      - name: Build complete candidate
        run: lake --wfail build Solution Challenge Transfer
      - name: Audit closed result and transfer
        shell: bash
        run: |
          set -o pipefail
          cat > .lake/Audit.lean <<'LEAN'
          module
          import Solution
          #print axioms Erdos687.covered_iff_shift
          #print axioms Erdos687.quadratic_transfer
          #print axioms Erdos687.quadratic_log
          LEAN
          lake env lean .lake/Audit.lean | tee axiom-report.txt
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool' axiom-report.txt
          grep -F "'Erdos687.quadratic_log' depends on axioms: [propext, Classical.choice, Quot.sound]" axiom-report.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .lake/build
            .lake/packages/jacobsthalLean435/.lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/AbsorptionCutoff/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: proof-progress-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}-${{ github.run_id }}
