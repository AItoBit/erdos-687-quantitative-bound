name: Lean transfer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: '--wfail Transfer Challenge'
      - name: Audit explicit conditional transfer
        shell: bash
        run: |
          set -o pipefail
          cat > .lake/Audit.lean <<'LEAN'
          module
          import Transfer
          #print axioms Erdos687.covered_iff_shift
          #print axioms Erdos687.quadratic_transfer
          LEAN
          lake env lean .lake/Audit.lean | tee axiom-report.txt
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool' axiom-report.txt
